<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Castellan</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <header>
      <h1>Castellan</h1>
      <p>A node-based world builder. Milestone M1: Noah builds the land and places the first leaves.</p>
    </header>
    <main>
      <div class="controls">
        <label>View
          <select id="view"><option value="terrain">terrain</option></select>
        </label>
        <button id="new-seed" type="button">New world</button>
        <span class="hint">Seed <code id="seed"></code></span>
      </div>
      <canvas id="world"></canvas>
      <p class="hint" id="summary"></p>
      <p class="hint legend">
        <span class="dot tree"></span> tree
        <span class="dot stone"></span> stone
        <span class="dot person"></span> person
      </p>
    </main>
    <script type="module" src="./src/ui/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Castellan</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <header>
      <h1>Castellan</h1>
      <p>A node-based world builder. Milestone M4: people explore, get a spot for a house from Molly, gather wood and build it; houses close together become a named village. Click a person to follow them.</p>
    </header>
    <main>
      <div class="controls">
        <strong id="clock"></strong>
        <label>Speed
          <select id="speed">
            <option value="0">paused</option>
            <option value="0.02">slow</option>
            <option value="0.06" selected>normal</option>
            <option value="0.25">fast</option>
            <option value="1">very fast</option>
          </select>
        </label>
        <label>View
          <select id="view"><option value="terrain">terrain</option></select>
        </label>
        <button id="new-seed" type="button">New world</button>
        <span class="hint">Seed <code id="seed"></code> · Packs <code id="packs"></code></span>
      </div>
      <canvas id="world"></canvas>
      <p class="hint" id="summary"></p>
      <p class="hint legend">
        <span class="dot tree"></span> tree
        <span class="dot stone"></span> stone
        <span class="dot person"></span> person
        <span class="sq house"></span> house
        <span class="sq site"></span> building site
        <span class="ring"></span> known to the selected person
      </p>
      <section id="person" aria-live="polite"></section>
    </main>
    <script type="module" src="./src/ui/main.ts"></script>
  </body>
</html>
